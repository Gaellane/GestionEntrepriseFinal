# ========= PREDICTION ML (SMILE Random Forest) =========
# Répertoire de stockage des modèles sérialisés
prediction.model.path=./models

# Nombre d'arbres dans la Random Forest
prediction.model.ntrees=100

# Profondeur maximale des arbres
prediction.model.maxDepth=10

# Nombre minimum de points pour entraîner un modèle par article
prediction.model.minArticleDataPoints=5

# Seuils d'alerte (ratio stock disponible / prédiction)
prediction.alert.attention-threshold=1.2
prediction.alert.critical-threshold=0.8

# Marge de sécurité pour le réapprovisionnement (1.2 = 20% de marge)
prediction.reorder.safety-margin=1.2

# Cron pour le réentraînement automatique (dimanche 2h du matin)
prediction.training.cron=0 0 2 * * SUN 
