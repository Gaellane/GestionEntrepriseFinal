# Adaptez les configuration a votre environnemnt

spring.application.name=gestion

spring.datasource.url=jdbc:postgresql://localhost:5432/gestiondb
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver


jwt.secret=cle_tres_secrete_tsy_misy_manana
jwt.expiration=86400000

logging.level.org.springframework.security=WARN
# Supprime les logs verbeux de la librairie SMILE Random Forest
logging.level.smile=ERROR
logging.level.smile.regression=ERROR
server.port=8180

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true


groq.api.model=llama-3.3-70b-versatile
groq.api.model.fast=llama-3.1-8b-instant
# Alternative models:
# - llama-3.1-70b-versatile (puissant mais lent)
# - llama-3.1-8b-instant (rapide, pour requêtes simples)
# - mixtral-8x7b-32768
# - gemma2-9b-it

# AI Orchestrator Settings
ai.orchestrator.max-iterations=8
ai.orchestrator.log-tool-calls=true
ai.orchestrator.strict-permissions=true

# AI Security Settings
ai.security.allow-dangerous-tools=false
ai.security.require-authentication=true

# Groq Client Settings
ai.groq.timeout=30
ai.groq.max-retries=3
 
# ========= PREDICTION ML (SMILE Random Forest) =========
# Répertoire de stockage des modèles sérialisés
prediction.model.path=./models

# Nombre d'arbres dans la Random Forest
prediction.model.ntrees=100

# Profondeur maximale des arbres
prediction.model.maxDepth=10

# Nombre minimum de points pour entraîner un modèle par article
prediction.model.minArticleDataPoints=5

# Seuils d'alerte (ratio stock disponible / prédiction)
prediction.alert.attention-threshold=1.2
prediction.alert.critical-threshold=0.8

# Marge de sécurité pour le réapprovisionnement (1.2 = 20% de marge)
prediction.reorder.safety-margin=1.2

# Cron pour le réentraînement automatique (dimanche 2h du matin)
prediction.training.cron=0 0 2 * * SUN 
